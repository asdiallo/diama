# ============================================================
#  Profil TEST — @QuarkusTest allégé.
#  DevServices Postgres + Redis (testcontainers, docker requis) ;
#  OIDC / Kafka / Elasticsearch neutralisés — la sécurité des
#  tests passe par @TestSecurity (identité mockée).
# ============================================================
"%test":
  quarkus:
    # OIDC désactivé : @TestSecurity fournit l'identité.
    oidc:
      enabled: false
    # Client OAuth2 sortant Swan neutralisé (pas d'IdP en test).
    # Les valeurs factices évitent l'échec d'expansion des ${SWAN_*}.
    oidc-client:
      swan:
        client-enabled: false
        auth-server-url: http://localhost:9999
        client-id: test-swan
        credentials:
          secret: test-secret
    # Hibernate Search inactif (pas de conteneur Elasticsearch).
    hibernate-search-orm:
      active: false
    # Kafka : pas de conteneur ; connexion paresseuse, health off.
    kafka:
      devservices:
        enabled: false
    reactive-messaging:
      health:
        enabled: false
    # Schedulers OFF : les entrées kafka_outbox restent PENDING, les tests
    # de flux pilotent eux-mêmes les consumers (déterminisme).
    scheduler:
      enabled: false
    # Keycloak DevService inutile (OIDC off) ; secret admin factice
    # pour satisfaire la validation du client_credentials au démarrage.
    keycloak:
      devservices:
        enabled: false
      admin-client:
        server-url: http://localhost:9080
        client-secret: test-secret
    log:
      category:
        "com.zalamtech.diama":
          level: DEBUG

  # Secrets partenaires factices : les valeurs de prod sont des expansions
  # ${ENV} sans défaut, qui échoueraient à la résolution en test.
  diama:
    thunes:
      api-key: test-thunes-key
      api-secret: test-thunes-secret
      webhook-secret: test-thunes-webhook-secret
    swan:
      webhook-secret: test-swan-webhook-secret
    didit:
      api-key: test-didit-api-key
      webhook-secret: test-didit-webhook-secret
      workflows:
        level-1: wf-level-1
        level-2: wf-level-2
        level-3: wf-level-3
        level-4: wf-level-4
    # Tous les tests partent de 127.0.0.1 : plafonds par IP relevés pour ne pas
    # dépendre de l'ordre d'exécution ni d'un conteneur Redis réutilisé.
    registration:
      rate-limit:
        register-per-hour: 100000
        resend-per-hour: 100000
