# ============================================================
#  Profil DEV — connexion à la stack Docker locale
#  (Postgres 5433, Redis 6379, Elastic 9200) et au Keycloak
#  mutualisé https://auth.zalamtech.fr (realm diama-transfer-app).
#  Les DevServices sont DÉSACTIVÉS : on utilise les conteneurs
#  déjà démarrés, pas des conteneurs éphémères.
# ============================================================
"%dev":
  quarkus:
    # --- DevServices OFF (on cible la stack locale) --------
    datasource:
      devservices:
        enabled: false
    redis:
      devservices:
        enabled: false
    keycloak:
      devservices:
        enabled: false
    hibernate-search-orm:
      elasticsearch:
        devservices:
          enabled: false
    # Kafka non fourni localement → DevServices conservé.
    kafka:
      devservices:
        enabled: true

    # OIDC → Keycloak mutualisé, realm diama-transfer-app (défauts de
    # application.yaml, rappelés ici pour lisibilité).
    oidc:
      auth-server-url: ${KEYCLOAK_URL:https://auth.zalamtech.fr}/realms/${KEYCLOAK_REALM:diama-transfer-app}

    # --- Logs DEBUG ---------------------------------------
    log:
      level: INFO
      category:
        "com.zalamtech.diama":
          level: DEBUG
        "org.hibernate.SQL":
          level: INFO
    hibernate-orm:
      log:
        sql: false
        format-sql: true

    # --- Swagger UI toujours exposé -----------------------
    swagger-ui:
      always-include: true
      path: /q/swagger-ui
