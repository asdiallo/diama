# ============================================================
#  Diama — stack de développement local
#
#  Démarrage :   docker compose up -d
#  Puis :        ./gradlew quarkusDev   (API sur l'hôte, hot reload)
#
#  Les ports publiés reflètent application-dev.yaml :
#  Postgres 5433, Keycloak 9080, Redis 6379, Elasticsearch 9200,
#  Kafka 9092, Kafka UI 8090.
#
#  Variante tout-conteneur : docker compose --profile app up -d
#  (construit l'image native via le Dockerfile — long, sans hot reload).
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: diama-postgres
    environment:
      POSTGRES_DB: diama
      POSTGRES_USER: ${DB_USER:-diama}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-diama}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Le schéma (V1__init_schema.sql, V2…) est appliqué par Flyway au
    # démarrage de l'API — pas de script d'init côté conteneur.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-diama} -d diama"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: diama-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: diama-kafka
    environment:
      # KRaft single-node (pas de ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: diama-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: diama-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8090:8080"
    depends_on:
      - kafka

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: diama-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "9080:8080"
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: diama-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"

  # --- API en conteneur (optionnel : docker compose --profile app up) ----
  diama-api:
    profiles: ["app"]
    build: .
    container_name: diama-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/diama
      DB_USER: ${DB_USER:-diama}
      DB_PASSWORD: ${DB_PASSWORD:-diama}
      REDIS_URL: redis://:${REDIS_PASSWORD:-eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81}@redis:6379
      KAFKA_BROKERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
      ELASTIC_HOSTS: elasticsearch:9200
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started

volumes:
  postgres-data:
