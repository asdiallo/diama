# ============================================================
#  Diama — stack de développement local
#
#  Démarrage :   docker compose up -d
#  Puis :        ./gradlew quarkusDev   (API sur l'hôte, hot reload)
#
#  Les ports publiés reflètent application-dev.yaml :
#  Postgres 5433, Redis 6379, Elasticsearch 9200, Kafka 9092,
#  Kafka UI 8090.
#
#  Keycloak : instance mutualisée https://auth.zalamtech.fr (realm
#  diama-transfer-app) — pas de Keycloak local.
#
#  Variante tout-conteneur : docker compose --profile app up -d
#  (image native zalamtech/diama-transfer-api tirée du registre).
#  Inclut le backoffice diama-admin (port 3100).
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: diama-postgres
    environment:
      POSTGRES_DB: diama
      POSTGRES_USER: ${DB_USER:-diama}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-diama}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Le schéma (V1__init_schema.sql, V2…) est appliqué par Flyway au
    # démarrage de l'API — pas de script d'init côté conteneur.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-diama} -d diama"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: diama-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: diama-kafka
    environment:
      # KRaft single-node (pas de ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: diama-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: diama-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      # Login intégré (formulaire) : l'UI est exposée publiquement via Traefik.
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?KAFKA_UI_PASSWORD requis (voir .env.example)}
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"

      - "traefik.http.routers.diama-kafka.rule=Host(`diama-kafka.zalamtech.fr`)"
      - "traefik.http.routers.diama-kafka.entrypoints=websecure"
      - "traefik.http.routers.diama-kafka.tls=true"
      - "traefik.http.routers.diama-kafka.tls.certresolver=ovhZalamtechFrResolver"
      - "traefik.http.routers.diama-kafka.tls.domains[0].main=diama-kafka.zalamtech.fr"

      - "traefik.http.services.diama-kafka.loadbalancer.server.port=8080"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: diama-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"

  # --- API en conteneur (optionnel : docker compose --profile app up) ----
  diama-api:
    profiles: ["app"]
    image: zalamtech/diama-transfer-api:1.0.0-SNAPSHOT
    container_name: diama-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/diama
      DB_USER: ${DB_USER:-diama}
      DB_PASSWORD: ${DB_PASSWORD:-diama}
      REDIS_URL: redis://:${REDIS_PASSWORD:-eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81}@redis:6379
      KAFKA_BROKERS: kafka:29092
      # Keycloak mutualisé (dev + pilote prod) ; surchargable via .env.
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.zalamtech.fr}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-diama-transfer-app}
      ELASTIC_HOSTS: elasticsearch:9200
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"

      - "traefik.http.routers.diama-api.rule=Host(`diama-api.zalamtech.fr`)"
      - "traefik.http.routers.diama-api.entrypoints=websecure"
      - "traefik.http.routers.diama-api.tls=true"
      - "traefik.http.routers.diama-api.tls.certresolver=ovhZalamtechFrResolver"
      - "traefik.http.routers.diama-api.tls.domains[0].main=diama-api.zalamtech.fr"

      - "traefik.http.services.diama-api.loadbalancer.server.port=8080"

  # --- Backoffice Next.js (optionnel : docker compose --profile app up) ----
  diama-admin:
    profiles: ["app"]
    image: zalamtech/diama-transfer-admin:0.1.0
    container_name: diama-admin
    environment:
      KEYCLOAK_ISSUER: ${KEYCLOAK_URL:-https://auth.zalamtech.fr}/realms/${KEYCLOAK_REALM:-diama-transfer-app}
      KEYCLOAK_CLIENT_ID: backoffice-app
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://diama-admin.zalamtech.fr}
      # API vue depuis le conteneur (réseau compose).
      API_BASE_URL: http://diama-api:8080
    ports:
      - "3100:3100"
    depends_on:
      - diama-api
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"

      - "traefik.http.routers.diama-admin.rule=Host(`diama-admin.zalamtech.fr`)"
      - "traefik.http.routers.diama-admin.entrypoints=websecure"
      - "traefik.http.routers.diama-admin.tls=true"
      - "traefik.http.routers.diama-admin.tls.certresolver=ovhZalamtechFrResolver"
      - "traefik.http.routers.diama-admin.tls.domains[0].main=diama-admin.zalamtech.fr"

      - "traefik.http.services.diama-admin.loadbalancer.server.port=3100"

volumes:
  postgres-data:

networks:
  # Réseau du reverse proxy Traefik (créé hors de ce compose).
  web:
    external: true
